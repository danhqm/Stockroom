name: stockroom
services:
  app:
    build: ./backend
    ports: ["127.0.0.1:8081:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockroom
      MYSQL_USER: stockroom
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u stockroom -D stockroom -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: stockroom_test
      MYSQL_USER: stockroom_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-test-root-only
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=local-test-only mysql -h 127.0.0.1 -u stockroom_test -D stockroom_test -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  mysql_data:
